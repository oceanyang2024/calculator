<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table of Contents</title>
<style>
:root{--bg:#eef1f4;--surface:#fff;--ink:#14202b;--muted:#5d6b78;--line:#d5dce3;--accent:#2f6f9f;color-scheme:light dark}
@media (prefers-color-scheme: dark){:root{--bg:#10171e;--surface:#18222c;--ink:#e6edf3;--muted:#8fa0af;--line:#2b3947;--accent:#5aa3d6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 18px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 20px}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li+li{border-top:1px solid var(--line)}
a{display:flex;justify-content:space-between;gap:16px;padding:14px 16px;color:var(--ink);text-decoration:none}
a:hover,a:focus-visible{background:var(--bg);outline:none}
a:hover .t,a:focus-visible .t{color:var(--accent);text-decoration:underline}
.t{font-weight:600}
.f{color:var(--muted);font-size:.85rem;align-self:center;overflow-wrap:anywhere;text-align:right}
.empty{padding:14px 16px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Table of Contents</h1>
  <p class="sub">1 page in this folder</p>
  <nav aria-label="Pages">
    <ul>
      <li><a href="expected-move.html"><span class="t">Expected Move Calculator</span><span class="f">expected-move.html</span></a></li>
    </ul>
  </nav>
</main>
</body>
</html>
